{% if complaint.attachment %}
<div>
    <p class="text-sm text-gray-500 mb-2">Attached {{ complaint.attachment_kind|default:"file" }}</p>
    {% if complaint.attachment_kind == 'video' %}
    <video controls preload="metadata" class="w-full max-h-96 rounded-lg bg-black"><source src="{{ complaint.attachment.url }}">Your browser cannot play this video.</video>
    {% elif complaint.attachment_kind == 'audio' %}
    <audio controls preload="metadata" class="w-full"><source src="{{ complaint.attachment.url }}">Your browser cannot play this recording.</audio>
    {% endif %}
    <a href="{{ complaint.attachment.url }}" target="_blank" class="inline-block mt-2 text-orange-500 hover:text-orange-600 text-sm"><i class="fas fa-download mr-1"></i>Download the {{ complaint.attachment_kind|default:"file" }}</a>
</div>
{% endif %}
