{# Shared theme: sans serif headings, dark mode and the theme toggle. Include it at the end of <head>. #}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<script>
    /* Apply the saved theme before the page paints, so there is no white flash */
    (function () {
        var theme = null;
        try { theme = localStorage.getItem('brgy-theme'); } catch (e) {}
        if (!theme) {
            theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        if (theme === 'dark') { document.documentElement.classList.add('dark'); }
        if (window.Chart && theme === 'dark') {
            Chart.defaults.color = '#cbd5e1';
            Chart.defaults.borderColor = 'rgba(148, 163, 184, 0.2)';
        }
    })();
</script>

    .theme-toggle {
        width: 2.5rem; height: 2.5rem; border-radius: 9999px;
        display: inline-flex; align-items: center; justify-content: center;
        color: #4b5563; transition: background 0.2s, color 0.2s;

    .theme-toggle:hover { background: #f3f4f6; color: #f97316; }
    .theme-toggle-floating {

    .theme-toggle .icon-sun { display: none; }

<script>
    /* Theme toggle: any element with data-theme-toggle switches light and dark.
       Pages without one get a small floating button in the corner. */
    document.addEventListener('DOMContentLoaded', function () {
        function setTheme(theme) {
            document.documentElement.classList.toggle('dark', theme === 'dark');
            try { localStorage.setItem('brgy-theme', theme); } catch (e) {}
        }
        var toggles = document.querySelectorAll('[data-theme-toggle]');
        if (!toggles.length) {
            var floating = document.createElement('button');
            floating.type = 'button';
            floating.className = 'theme-toggle theme-toggle-floating';
            floating.setAttribute('data-theme-toggle', '');
            floating.setAttribute('aria-label', 'Switch light or dark mode');
            floating.setAttribute('title', 'Light or dark mode');
            floating.innerHTML = '<i class="fas fa-moon icon-moon"></i><i class="fas fa-sun icon-sun"></i>';
            document.body.appendChild(floating);
            toggles = [floating];
        }
        Array.prototype.forEach.call(toggles, function (button) {
            button.addEventListener('click', function () {
                setTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark');
            });
        });
    });
</script>
